name: Code Quality

on:
  pull_request:
  workflow_dispatch:

permissions: {}
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci --only=dev
      - parallel:
          - name: prettier
            run: npx prettier . --check --no-editorconfig;
          - name: oxlint/eslint
            run: npx run lint:oxlint
