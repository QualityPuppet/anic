name: Code Quality

on:
  pull_request:
  workflow_dispatch:

permissions: {}
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci --only=dev
      - run: |
          npx prettier . --check --no-editorconfig;
          npx run lint:oxlint
